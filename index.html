<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}</style>
<title>Janice's Charis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#FFFFFF;
  --surface:#FFFFFF;
  --tint:#F4F7FC;
  --ink:#0F2143;
  --muted:#6B7890;
  --line:#E2E8F1;
  --silver:#C9D1DC;
  --accent:#1F4FA0;
  --accent-soft:#EAF0FA;
  --accent-ink:#FFFFFF;
  --kr:#2C73B8;
  --kr-soft:#E7F1FA;
  --bar:#0F2143;
  --bar-ink:#FFFFFF;
  --bar-muted:#93A3C0;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Jost","Avenir Next","Helvetica Neue",sans-serif;
  --brand:"Jost","Avenir Next","Helvetica Neue",sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 140px}
.wrap{max-width:760px;margin:0 auto}
body.kr{--accent:var(--kr);--accent-soft:var(--kr-soft)}

header{padding-block:36px 20px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand{display:grid;justify-items:start;gap:6px;margin:18px 0 14px}
.brand .charis{font-family:var(--brand);font-weight:400;font-size:12px;letter-spacing:.55em;color:var(--muted);padding-left:2px}
.wordmark{font-family:var(--brand);font-weight:400;font-size:clamp(30px,8vw,46px);letter-spacing:.32em;color:var(--ink);display:flex;align-items:center;line-height:1;margin:0}
.wordmark .mark{width:.95em;height:.95em;color:var(--accent);margin:0 .32em 0 .02em;flex:none}
.wordmark span:last-child{margin-right:-.32em}
.brand .title-mark{font-family:var(--brand);font-weight:400;font-size:clamp(30px,8vw,46px);letter-spacing:.03em;line-height:1.1;color:var(--ink)}
.brand .wordmark{font-size:15px;letter-spacing:.34em;color:var(--muted);font-weight:400}
.brand .wordmark .mark{width:1.15em;height:1.15em}
.gate-card .title-mark{font-size:32px}
.brand .rule{width:64px;height:2px;background:linear-gradient(90deg,var(--accent),var(--silver))}
h1{font-family:var(--sans);font-weight:500;font-size:20px;letter-spacing:.08em;margin:0 0 6px}
.lede{color:var(--muted);margin:0;max-width:52ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:1px solid var(--line);background:var(--tint);color:var(--ink);font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .count{font-family:var(--num);font-size:13px;min-width:22px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);line-height:20px}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.22);color:inherit}
.tab:focus-visible,.step:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notice{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border-left:3px solid var(--accent);color:var(--ink);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 16px}
.notice b{color:var(--accent)}

section.group{margin-top:28px}
.group h2{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:.04em;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 28px -22px rgba(15,33,67,.35)}

.item{display:grid;grid-template-columns:64px 1fr auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);transition:background .2s}
.item:first-child{border-top:0}
.item.on{background:var(--accent-soft)}
.name{font-weight:500;line-height:1.4}
.spec{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.sub{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.sub li::before{content:"· "}
.thumb{grid-column:1;grid-row:1/span 3;align-self:start;display:block;position:relative;width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid var(--line);overflow:hidden}
.thumb img{position:absolute;inset:4px;display:block;width:calc(100% - 8px);height:calc(100% - 8px);max-width:none;object-fit:contain}
.thumb.none{background:var(--tint);border-color:transparent;color:var(--silver)}
.thumb.none .mark{position:absolute;inset:0;margin:auto;width:24px;height:24px}
.item>.info{grid-column:2}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .price{color:var(--ink);font-weight:700}
.meta .krw{text-decoration:none}
.stepper{grid-column:3;grid-row:1/span 2;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.step{appearance:none;border:0;width:34px;height:34px;border-radius:50%;background:transparent;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step:hover{background:var(--accent-soft)}
.step.plus{background:var(--accent);color:var(--accent-ink)}
.step:disabled{opacity:.3;cursor:default;background:transparent}
.qty{width:34px;text-align:center;border:0;background:transparent;color:var(--ink);font-family:var(--num);font-size:17px;font-weight:600;padding:0;-moz-appearance:textfield}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.line-total{grid-column:2/-1;font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}

.orderer{margin-top:28px;display:grid;gap:6px}
.orderer label{font-size:13px;color:var(--muted)}
.orderer input{font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);color:var(--bar-ink);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.totals{flex:1;display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;min-width:0}
.totals .k{font-size:11.5px;letter-spacing:.12em;color:var(--bar-muted);display:block}
.totals .v{font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.totals .v.small{font-size:17px}
.actions{display:flex;gap:8px}
.btn{appearance:none;font:inherit;font-weight:500;font-size:14px;border-radius:999px;padding:10px 16px;cursor:pointer;border:1px solid var(--bar-muted);background:transparent;color:var(--bar-ink)}
.btn.primary{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.btn:disabled{opacity:.4;cursor:default}

.sheet{max-width:760px;margin:0 auto 12px;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;max-height:45vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-family:var(--sans);font-size:15px}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.sheet td{padding:6px 0;border-top:1px solid var(--line)}
.sheet td.r{text-align:right;white-space:nowrap;padding-left:12px}
.sheet .muted{color:var(--muted);font-size:12.5px}
.sheet tr.conv td{border-top:2px solid var(--accent);color:var(--accent)}
.fx{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.fx-field{display:grid;gap:4px;flex:1;min-width:150px}
.fx-field label{font-size:12.5px;color:var(--muted)}
.fx-input{display:flex;align-items:center;gap:8px}
.fx input,.fx select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink);width:100%}
.fx-input input{max-width:140px;font-family:var(--num);font-weight:600}
.fx-input span{font-size:13.5px;color:var(--muted)}
.fx select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet .empty{color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:20}
textarea.fallback{width:100%;min-height:120px;margin-top:8px;font:12.5px/1.5 var(--sans);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--ground);color:var(--ink)}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px -30px rgba(15,33,67,.35);padding:28px 24px;display:grid;gap:12px}
.gate-card h2{font-family:var(--sans);font-weight:500;font-size:18px;letter-spacing:.06em;margin:0}
.gate-card .brand{margin:0 0 6px}
.gate-card p{margin:0;color:var(--muted);font-size:13.5px}
.gate-card input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ground);color:var(--ink);width:100%}
.gate-card .gate-err{color:#B3413A}
.gate-btn{appearance:none;border:0;font:inherit;font-weight:500;padding:12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.gate-btn:disabled{opacity:.5}
.gate-btn:focus-visible,.lock:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lock{appearance:none;font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
@media (max-width:480px){
  .item{grid-template-columns:52px 1fr auto;gap:4px 10px;padding:12px}
  .thumb{width:52px;height:52px}
  .wordmark{letter-spacing:.24em}
  .totals .v{font-size:20px}
  .totals{gap:16px}
  .actions{width:100%}
  .actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="gate" id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div class="brand"><div class="title-mark">Janice&rsquo;s Charis</div><div class="wordmark" aria-label="RENECELL"><span>RENE</span><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 6.8v10.4M6.8 12h10.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>CELL</span></div><span class="rule"></span></div>
    <h2>團隊專用訂購單</h2>
    <p>請輸入團隊密碼。密碼會不定期更換，換新後需要重新輸入。</p>
    <label for="gate-pw" class="sr">密碼</label>
    <input id="gate-pw" type="password" placeholder="輸入密碼" autocomplete="current-password" required>
    <p class="gate-err" id="gate-err" hidden>密碼不正確，請再確認一次，或向團隊負責人索取最新密碼。</p>
    <button class="gate-btn" id="gate-btn" type="submit">進入訂購單</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="topline"><div class="eyebrow">Team Order Form</div><button class="lock" id="btn-lock" type="button">鎖定</button></div>
    <div class="brand"><div class="title-mark">Janice&rsquo;s Charis</div><div class="wordmark" aria-label="RENECELL"><span>RENE</span><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 6.8v10.4M6.8 12h10.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>CELL</span></div><span class="rule"></span></div>
    <h1>現貨訂購單</h1>
    <p class="lede">點 ＋／− 選數量，金額與 RV 會即時加總。一般訂購與韓國單分開計算，完成後可一鍵複製訂單明細傳給我們。</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-general" role="tab" aria-selected="true" data-tab="general">一般訂購 <span class="count" id="count-general">0</span></button>
    <button class="tab" id="tab-kr" role="tab" aria-selected="false" data-tab="kr">韓國單 <span class="count" id="count-kr">0</span></button>
  </div>

  <main id="panel"></main>

  <div class="orderer">
    <label for="buyer">訂購人（選填，會帶進複製的明細）</label>
    <input id="buyer" type="text" placeholder="姓名／會員編號" autocomplete="name">
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="sheet" id="sheet" hidden>
    <div id="sheet-body"></div>
    <div class="fx" id="fx" hidden>
      <div class="fx-field">
        <label for="fx-rate">匯率：1 台幣 ＝</label>
        <div class="fx-input"><input id="fx-rate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 42"><span>韓幣</span></div>
      </div>
    </div>
  </div>
  <div class="bar-in">
    <div class="totals">
      <div><span class="k" id="label-amt">一般訂購 總額</span><span class="v" id="sum-amt">NT$0</span></div>
      <div id="sum-twd" hidden><span class="k">換算台幣</span><span class="v small" id="sum-twd-v"></span></div>
      <div><span class="k">總 RV</span><span class="v small" id="sum-rv">0</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-detail">查看明細</button>
      <button class="btn" id="btn-clear">清空</button>
      <button class="btn primary" id="btn-copy">複製訂單</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const fmt = n => Math.round(n).toLocaleString("zh-TW");
const nt = n => "NT$" + fmt(n);
const won = n => "₩" + fmt(n);
const isKR = tab => tab === "kr";
// 韓國單：價格以韓幣會員價計（資料來源：韓國單全品項，RV × 1.1）
const unitKRW = it => it.krw;
let state = { tab:"general", qty:{ general:{}, kr:{} }, buyer:"", rate:"" };
try { const s = JSON.parse(localStorage.getItem("readysale-order")||"null"); if (s && s.qty) state = Object.assign(state, s); } catch(e){}
const save = () => { try { localStorage.setItem("readysale-order", JSON.stringify(state)); } catch(e){} };
const rateNum = () => { const r = parseFloat(state.rate); return r > 0 ? r : 0; };

const allItems = tab => DATA[tab].groups.flatMap(g => g.items);
function totals(tab){
  let amt=0, rv=0, pcs=0; const lines=[];
  for (const it of allItems(tab)){
    const q = state.qty[tab][it.id]||0;
    if (q>0){ amt += q*(isKR(tab) ? unitKRW(it) : it.price); rv+=q*it.rv; pcs+=q; lines.push({it,q}); }
  }
  return {amt,rv,pcs,lines};
}
const money = (tab, n) => isKR(tab) ? won(n) : nt(n);
const lineText = (it, q) => isKR(state.tab)
  ? `小計 ${won(q*unitKRW(it))} ・ RV ${fmt(q*it.rv)}`
  : `小計 ${nt(q*it.price)} ・ RV ${fmt(q*it.rv)}`;

const panel = document.getElementById("panel");
function render(){
  const tab = state.tab, d = DATA[tab];
  document.body.classList.toggle("kr", isKR(tab));
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  let h = d.notice ? `<div class="notice">${d.notice}</div>` : "";
  for (const g of d.groups){
    h += `<section class="group"><h2>${g.title}${g.note?`<small>${g.note}</small>`:""}</h2><div class="list">`;
    for (const it of g.items){
      const q = state.qty[tab][it.id]||0;
      const meta = isKR(tab)
        ? `<span class="price">會員價 ${won(it.krw)}</span><span>RV ${fmt(it.rv)}</span>`
        : `<span class="price">${nt(it.price)}</span><span>RV ${fmt(it.rv)}</span>`;
      const thumb = it.img && IMG[it.img] ? `<div class="thumb"><img src="${IMG[it.img]}" alt="" loading="lazy"></div>` : `<div class="thumb none"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 6.8v10.4M6.8 12h10.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div>`;
      h += `<div class="item${q?" on":""}" data-id="${it.id}">
        ${thumb}
        <div class="info">
          <span class="name">${it.name}</span>${it.spec?`<span class="spec">${it.spec}</span>`:""}
          ${it.sub?`<ul class="sub">${it.sub.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}
        </div>
        <div class="stepper">
          <button class="step minus" aria-label="${it.name} 減少" ${q?"":"disabled"}>−</button>
          <input class="qty" id="q-${it.id}" type="number" inputmode="numeric" min="0" value="${q}" aria-label="${it.name} 數量">
          <button class="step plus" aria-label="${it.name} 增加">＋</button>
        </div>
        <div class="meta">${meta}</div>
        <div class="line-total"${q?"":" hidden"}>${q?lineText(it,q):""}</div>
      </div>`;
    }
    h += `</div></section>`;
  }
  panel.innerHTML = h;
  fx.hidden = !isKR(tab);
  updateBar();
}

function setQty(id, q){
  const tab = state.tab;
  q = Math.max(0, Math.min(999, Math.floor(Number(q)||0)));
  if (q) state.qty[tab][id]=q; else delete state.qty[tab][id];
  const it = allItems(tab).find(x=>x.id===id);
  const row = panel.querySelector(`.item[data-id="${id}"]`);
  row.classList.toggle("on", q>0);
  row.querySelector(".qty").value = q;
  row.querySelector(".minus").disabled = !q;
  const lt = row.querySelector(".line-total");
  lt.hidden = !q; lt.textContent = q ? lineText(it,q) : "";
  save(); updateBar();
}

const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
const fx = document.getElementById("fx");
function updateBar(){
  const tab = state.tab, t = totals(tab), r = rateNum();
  document.getElementById("label-amt").textContent = isKR(tab) ? "韓幣總額（會員價）" : "一般訂購 總額";
  document.getElementById("sum-amt").textContent = money(tab, t.amt);
  const twd = document.getElementById("sum-twd");
  twd.hidden = !(isKR(tab) && r);
  if (r) document.getElementById("sum-twd-v").textContent = "≈ " + nt(t.amt / r);
  document.getElementById("sum-rv").textContent = fmt(t.rv);
  for (const k of ["general","kr"]) document.getElementById("count-"+k).textContent = totals(k).pcs;
  document.getElementById("btn-copy").disabled = !t.pcs;
  document.getElementById("btn-clear").disabled = !t.pcs;
  if (!sheet.hidden) renderSheet();
}
function renderSheet(){
  const tab = state.tab, t = totals(tab), kr = isKR(tab), r = rateNum();
  if (!t.lines.length){ sheetBody.innerHTML = `<h3>${DATA[tab].label} 明細</h3><p class="empty">還沒有選任何品項。</p>`; }
  else {
    const unit = it => kr ? unitKRW(it) : it.price;
    let rows = t.lines.map(({it,q}) =>
      `<tr><td>${it.name}${it.spec?` <span class="spec">${it.spec}</span>`:""}</td><td class="r">× ${q}</td><td class="r">${money(tab, q*unit(it))}</td></tr>`).join("");
    rows += `<tr><td><b>合計</b></td><td class="r">RV ${fmt(t.rv)}</td><td class="r"><b>${money(tab, t.amt)}</b></td></tr>`;
    if (kr) rows += r
      ? `<tr class="conv"><td>換算台幣 <span class="muted">（${won(t.amt)} ÷ ${r}）</span></td><td></td><td class="r"><b>${nt(t.amt / r)}</b></td></tr>`
      : `<tr class="conv"><td colspan="3" class="muted">輸入下方匯率後，會在這裡顯示台幣金額</td></tr>`;
    sheetBody.innerHTML = `<h3>${DATA[tab].label} 明細 · 共 ${t.pcs} 件</h3><table>${rows}</table>`;
  }
}
function orderText(){
  const tab = state.tab, t = totals(tab), d = DATA[tab], kr = isKR(tab), r = rateNum();
  const out = [`【Janice's Charis ${d.label}】`];
  if (state.buyer.trim()) out.push("訂購人：" + state.buyer.trim());
  out.push("");
  t.lines.forEach(({it,q}) => out.push(`${it.name}${it.spec?` (${it.spec})`:""} × ${q} ＝ ${money(tab, q*(kr?unitKRW(it):it.price))}`));
  out.push("", `共 ${t.pcs} 件`);
  if (kr){
    out.push(`韓幣總額（會員價）：${won(t.amt)}`);
    if (r) out.push(`匯率：1 台幣 = ${r} 韓幣`, `換算台幣：${nt(t.amt / r)}`);
    out.push(`總RV：${fmt(t.rv)}`, "※ 另計運費及關稅，台幣金額以首席訂貨匯率為準");
  } else {
    out.push(`總額：${nt(t.amt)}`, `總RV：${fmt(t.rv)}`);
  }
  return out.join("\n");
}
let toastTimer;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,1800); }

panel.addEventListener("click", e => {
  const b = e.target.closest(".step"); if (!b) return;
  const id = b.closest(".item").dataset.id, cur = state.qty[state.tab][id]||0;
  setQty(id, cur + (b.classList.contains("plus")?1:-1));
});
panel.addEventListener("change", e => { if (e.target.classList.contains("qty")) setQty(e.target.closest(".item").dataset.id, e.target.value); });
panel.addEventListener("focusin", e => { if (e.target.classList.contains("qty")) e.target.select(); });
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.tab=b.dataset.tab; save(); render(); window.scrollTo({top:0}); }));
const buyer = document.getElementById("buyer");
buyer.value = state.buyer||"";
buyer.addEventListener("input", () => { state.buyer = buyer.value; save(); });
const rateIn = document.getElementById("fx-rate");
rateIn.value = state.rate||"";
rateIn.addEventListener("input", () => { state.rate = rateIn.value; save(); updateBar(); });
const btnDetail = document.getElementById("btn-detail");
function openSheet(open){ sheet.hidden = !open; btnDetail.textContent = open ? "收起明細" : "查看明細"; if (open) renderSheet(); }
btnDetail.addEventListener("click", () => openSheet(sheet.hidden));
let clearArmed=false, clearTimer;
document.getElementById("btn-clear").addEventListener("click", e => {
  if (!clearArmed){ clearArmed=true; e.target.textContent="確定清空？"; clearTimer=setTimeout(()=>{clearArmed=false;e.target.textContent="清空";},2500); return; }
  clearTimeout(clearTimer); clearArmed=false; e.target.textContent="清空";
  state.qty[state.tab]={}; save(); render(); toast(DATA[state.tab].label+" 已清空");
});
document.getElementById("btn-copy").addEventListener("click", () => {
  const txt = orderText();
  const fallback = () => {
    openSheet(true);
    sheetBody.innerHTML = `<h3>複製下方文字</h3><textarea class="fallback" id="copy-fallback" readonly></textarea>`;
    const ta=document.getElementById("copy-fallback"); ta.value = txt; ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(txt).then(()=>toast("訂單明細已複製"), fallback); } catch(e){ fallback(); }
});
// ── 密碼鎖：品項與價格以 AES-GCM 加密，只有正確密碼能解開 ──
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
const PW_KEY = "readysale-pw";
function enter(data){
  DATA = data.data; IMG = data.img;
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("bar").hidden = false;
  render();
}
const gatePw = document.getElementById("gate-pw"), gateErr = document.getElementById("gate-err"), gateBtn = document.getElementById("gate-btn");
document.getElementById("gate-form").addEventListener("submit", async e => {
  e.preventDefault();
  gateBtn.disabled = true; gateErr.hidden = true;
  try {
    const data = await unlock(gatePw.value);
    try { localStorage.setItem(PW_KEY, gatePw.value); } catch(_){}
    enter(data);
  } catch(_) { gateErr.hidden = false; gatePw.select(); }
  gateBtn.disabled = false;
});
document.getElementById("btn-lock").addEventListener("click", () => {
  try { localStorage.removeItem(PW_KEY); } catch(_){}
  location.reload();
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch(_){}
  if (saved) {
    try { return enter(await unlock(saved)); }
    catch(_) { try { localStorage.removeItem(PW_KEY); } catch(__){} }
  }
  gatePw.focus();
})();
</script>
